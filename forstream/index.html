<style>

umpkin{width:76px;height:63px;margin-top:24px}@media(max-width:700px){main{padding:36px 28px}.stage{grid-template-columns:1fr;gap:26px}.wheel-wrap{max-width:430px}.panel{text-align:center;padding:20px 0}h2{margin:8px 0}.pumpkin{display:none}footer{line-height:1.6;text-align:center}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}

<body><main>
<header><p class="eyebrow">CHRISTINA AND AMBER</p><h1>Blessing <em>Or</em> Curse</h1></header>
<section class="stage" aria-label="Halloween wheel">
<div class="wheel-wrap"><div class="pointer" aria-hidden="true"></div>
<svg class="wheel" viewBox="0 0 600 600" role="group" aria-label="Challenge wheel. Focus or tap a segment to read its description.">
<circle cx="300" cy="300" r="288" fill="#242820" stroke="#be9360" stroke-width="2"/>
<circle cx="300" cy="300" r="279" fill="none" stroke="#be9360" stroke-width="4" stroke-dasharray="2 15"/>
<g id="rotor"></g>
<circle cx="300" cy="300" r="69" fill="#171a17" stroke="#dfcaa5" stroke-width="2"/>
<circle cx="300" cy="300" r="60" fill="none" stroke="#786c52"/>
<path d="M306 263C271 269 270 321 307 334C280 341 256 321 261 294C265 274 285 259 306 263Z" fill="#e8d5b4"/>
<path d="M324 280L328 291L339 295L328 299L324 310L320 299L309 295L320 291Z" fill="#b96837"/>
</svg></div>
<div class="panel"><h2>Spin for Your Fate.</h2><p id="wheel-status" role="status">Luck decides if you get a nice treat or a punishment.</p><p>Good Luck.</p><button class="spin" id="spin" type="button" aria-describedby="wheel-status">SPIN THE WHEEL</button>
<div id="hint" aria-live="polite"><strong id="hint-title">Explore your fate</strong><p id="hint-description">Hover over a slice, or tap it, to read the challenge.</p></div><svg class="pumpkin" viewBox="0 0 90 72" aria-hidden="true"><path d="M43 19Q39 7 51 5L55 9Q45 11 49 22" fill="#8f9972"/><g fill="#aa5b34" stroke="#171a17" stroke-width="2"><ellipse cx="27" cy="44" rx="22" ry="25"/><ellipse cx="62" cy="44" rx="22" ry="25"/><ellipse cx="45" cy="44" rx="21" ry="27"/></g><path d="M26 43L35 33L39 45ZM51 45L55 33L65 43ZM29 52L41 56L45 51L50 56L62 51L54 63L39 63Z" fill="#171a17"/></svg>
</div></section>
</main>
<dialog id="result" aria-labelledby="result-title" aria-describedby="result-description">
<span class="small">Your fate is decided</span><h2 id="result-title"></h2><p id="result-description"></p>
<form method="dialog"><button class="spin" autofocus>BACK TO THE WHEEL</button></form></dialog>
<script>
const challenges = [
 {name:"Mystery Shot",lines:["Mystery","Shot"],description:"A shot made from condiments picked beforehand. One prepares it for the other, keeping the mixture a mystery."},
 {name:"The Other Pays",lines:["The Other","Pays"],description:"Shopping spree on stream! A coin flip decides who gets the treat, and the other pays."},
 {name:"Slide into DMs",lines:["Slide into","DMs"],description:"Pick a celebrity and DM them a funny line."},
 {name:"Egg Smash",lines:["Egg","Smash"],description:"Simple. Both get a raw egg smashed on their heads."},
 {name:"Social Sabotage",lines:["Social","Sabotage"],description:"Both post from each other's social media account without the other knowing what it is. One post each."},
 {name:"Scary Gaming",lines:["Scary","Gaming"],description:"A Five Nights at Freddy's stream."},
 {name:"Pie in The Face",lines:["Pie in","The Face"],description:"A whipped cream pie in the face. Both have to do it."},
 {name:"Dancing Challenge",lines:["Dancing","Challenge"],description:"Both do a TikTok dance, separately or as a duo. It has to be posted."},
 {name:"Tattoo or Piercing?",lines:["Tattoo or","Piercing?"],description:"Christina and Amber decide between themselves who gets a tattoo, piercing or tooth gem of their choice. Only one needs to do it."},
 {name:"Chat's Date Night",lines:["Chat's","Date Night"],description:"Chat gets a few options for a date night stream. Their pick!"}
];
const rotor=document.getElementById('rotor'), spin=document.getElementById('spin'), result=document.getElementById('result');
const svgNS='http://www.w3.org/2000/svg', step=360/challenges.length;
let rotation=0, busy=false;
function point(angle,r=266){const t=angle*Math.PI/180;return [300+r*Math.cos(t),300+r*Math.sin(t)];}
function svg(tag,attrs){const el=document.createElementNS(svgNS,tag);for(const [k,v] of Object.entries(attrs))el.setAttribute(k,v);return el;}
function describe(i){if(busy)return;document.getElementById('hint-title').textContent=challenges[i].name;document.getElementById('hint-description').textContent=challenges[i].description;}
challenges.forEach((item,i)=>{
 const angle=-90+i*step, p=point(angle-step/2),q=point(angle+step/2);
 const group=svg('g',{class:'slice',role:'button',tabindex:'0','aria-label':item.name+': '+item.description});
 const path=svg('path',{d:'M300 300L'+p.join(' ')+'A266 266 0 0 1 '+q.join(' ')+'Z',fill:i%2?'#263b30':'#a75832',stroke:'#d3b48a','stroke-width':1.4});
 group.append(path);
 const pos=point(angle,177),label=svg('text',{'text-anchor':'middle',transform:'translate('+pos.join(' ')+') rotate('+(angle>0&&angle<180?angle-90:angle+90)+')'});
 item.lines.forEach((line,j)=>{const span=svg('tspan',{x:0,y:(j-(item.lines.length-1)/2)*18+5});span.textContent=line;label.append(span);});
 group.append(label);group.addEventListener('pointerenter',()=>describe(i));group.addEventListener('focus',()=>describe(i));group.addEventListener('click',()=>describe(i));
 group.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();describe(i);}});
 rotor.append(group);
});
function randomIndex(n){
 const data=new Uint32Array(1),limit=Math.floor(4294967296/n)*n;
 do{crypto.getRandomValues(data);}while(data[0]>=limit);
 return data[0]%n;
}
spin.addEventListener('click',async()=>{
 if(busy)return;busy=true;spin.disabled=true;spin.textContent='SPINNING…';rotor.classList.add('spinning');
 const selected=randomIndex(challenges.length),target=(360-selected*step)%360;
 const delta=(target-rotation%360+360)%360,finish=rotation+360*6+delta;
 const duration=matchMedia('(prefers-reduced-motion: reduce)').matches?150:5500;
 const animation=rotor.animate([{transform:'rotate('+rotation+'deg)'},{transform:'rotate('+finish+'deg)'}],{duration,easing:'cubic-bezier(.12,.65,.12,1)',fill:'forwards'});
 await animation.finished;
 rotation=finish%360;rotor.style.transform='rotate('+rotation+'deg)';animation.cancel();
 busy=false;rotor.classList.remove('spinning');spin.disabled=false;spin.textContent='SPIN THE WHEEL';
 describe(selected);
 document.getElementById('result-title').textContent=challenges[selected].name;
 document.getElementById('result-description').textContent=challenges[selected].description;
 result.showModal();
});
result.addEventListener('close',()=>spin.focus());
</script></body></html>
