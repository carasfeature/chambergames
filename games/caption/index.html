<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caption This</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/ui.css">
<style>
:root{ --ink:#241C30; --paper:#FFF8EC; --taxi:#FFC629; --pink:#FF6FB5; --bad:#FF8D7F; --card:#2E2540; }

.stage{width:100%; max-width:1000px; display:grid; gap:16px}
.titlebar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap}
.titlebar h1{font-family:Bungee,cursive; font-weight:400; font-size:clamp(28px,5vw,44px); margin:0; color:var(--taxi); line-height:1}
.chip{font-family:Bungee,cursive; font-size:clamp(15px,2.2vw,20px); padding:8px 16px; border-radius:999px; background:var(--card); color:var(--paper)}
.chip.live{background:var(--pink); color:var(--ink)}

.picture{position:relative; border-radius:16px; overflow:hidden; background:#1B1526; box-shadow:0 10px 0 -4px rgba(0,0,0,.45)}
.picture img{display:block; width:100%; max-height:62vh; object-fit:contain; background:#1B1526}
.clock{
  position:absolute; top:14px; right:14px; min-width:92px; text-align:center;
  font-family:Bungee,cursive; font-size:clamp(30px,5vw,50px); line-height:1; padding:10px 16px;
  border-radius:14px; background:rgba(20,15,28,.85); color:var(--taxi);
}
.clock.low{color:var(--bad)}
.bar{height:12px; background:rgba(255,255,255,.1); border-radius:999px; overflow:hidden}
.bar i{display:block; height:100%; width:100%; background:var(--taxi); transition:width .25s linear}
.bar i.low{background:var(--bad)}

.entry{display:flex; gap:10px; flex-wrap:wrap}
.entry input{
  flex:1 1 320px; background:var(--card); color:var(--paper); border:3px solid transparent; border-radius:12px;
  padding:16px 18px; font:800 clamp(17px,2.2vw,21px) Nunito,sans-serif;
}
.entry input:focus{outline:none; border-color:var(--taxi)}
.entry input:disabled{opacity:.55}
.btn{ font-family:Bungee,cursive; font-size:18px; background:var(--taxi); color:var(--ink);
      border:3px solid var(--ink); border-radius:12px; padding:14px 28px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.5); }
.btn:hover{transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,.5)}
.btn:active{transform:translateY(5px); box-shadow:0 0 0 rgba(0,0,0,.5)}
.btn[disabled]{opacity:.4; cursor:not-allowed; transform:none; box-shadow:0 5px 0 rgba(0,0,0,.5)}
.hint{margin:0; min-height:22px; font-size:15px; font-weight:700; opacity:.85}
.hint.bad{color:var(--bad); opacity:1}
.hint.ok{color:#8FE3A8; opacity:1}
.example{margin:0; font-size:clamp(20px,2.6vw,25px); font-weight:900; color:#E7DEF2}
.example b{color:var(--taxi); font-family:Bungee,cursive; font-weight:400}
.entry input.example-mode::placeholder{font-weight:900; font-size:1.05em; color:var(--paper); opacity:.85}

.answers{display:grid; gap:12px; grid-template-columns:1fr}
@media(min-width:700px){.answers{grid-template-columns:1fr 1fr}}
.answer{
  background:var(--card); border-radius:14px; padding:18px 20px; border:3px solid transparent;
  font:800 clamp(17px,2.2vw,22px)/1.35 Nunito,sans-serif; animation:rise .35s ease-out both;
}
@keyframes rise{from{opacity:0; transform:translateY(12px)}to{opacity:1; transform:none}}

.idle{background:var(--card); border-radius:16px; padding:60px 24px; text-align:center; font-size:20px; font-weight:800; opacity:.85}

/* ---------- winner ---------- */
.winner{
  position:fixed; inset:0; z-index:20; display:none; place-items:center; padding:24px; text-align:center;
  background:radial-gradient(circle at center, rgba(46,37,64,.92), rgba(20,15,28,.97));
}
.winner.on{display:grid}
.winner .who{font-family:Bungee,cursive; font-size:clamp(34px,7vw,78px); line-height:1.05; color:var(--taxi);
             text-shadow:0 5px 0 rgba(0,0,0,.5); animation:boom .6s cubic-bezier(.2,1.6,.4,1) both; overflow-wrap:anywhere}
.winner .line{font-family:Bungee,cursive; font-size:clamp(20px,3.4vw,34px); color:var(--paper); margin-top:10px}
.winner .said{max-width:820px; margin:26px auto 0; font:800 clamp(20px,3vw,30px)/1.35 Nunito,sans-serif;
              background:rgba(255,255,255,.08); border-radius:16px; padding:20px 24px}
@keyframes boom{from{transform:scale(.3); opacity:0}to{transform:scale(1); opacity:1}}
#fx{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:21}

/* ---------- winners board ---------- */
.board{width:100%; max-width:1000px}
.board h2{font-family:Bungee,cursive; font-weight:400; font-size:18px; margin:0 0 12px; color:var(--taxi)}
.board ol{list-style:none; margin:0; padding:0; display:grid; gap:6px}
@media(min-width:640px){.board ol{grid-template-columns:1fr 1fr; grid-template-rows:repeat(5,auto); grid-auto-flow:column; gap:6px 18px}}
.board li{display:grid; grid-template-columns:96px 1fr; gap:12px; align-items:center;
          background:rgba(255,255,255,.06); border-radius:10px; padding:10px 14px; font-weight:700; font-size:15px}
.board li.done{background:rgba(255,198,41,.10)}
.board .rlabel{font-family:Bungee,cursive; font-size:13px; color:var(--taxi); opacity:.85}
.board .rwin{font-weight:800}
.board .rwin.pending{opacity:.4; font-weight:700}
@media(prefers-reduced-motion:reduce){.answer,.winner .who{animation:none}}
</style>
</head>
<body>

<nav class="topbar"><a class="back" href="../../index.html#section=krispysgames"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 L3 7 L9 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a></nav>

<main class="stage">
  <div class="titlebar">
    <h1>Caption This</h1>
    <span class="chip" id="chip">Waiting…</span>
  </div>

  <div class="idle" id="idle">Caption This starts soon — stay here, the picture will appear by itself.</div>

  <div id="live" hidden>
    <div class="picture">
      <img id="shot" alt="Picture to caption">
      <div class="clock" id="clock" hidden>30</div>
    </div>
    <div class="bar" id="bar" hidden style="margin-top:12px"><i id="barFill"></i></div>

    <div id="entryArea" style="display:grid; gap:10px; margin-top:14px">
      <div class="entry">
        <input id="text" maxlength="100" autocomplete="off" placeholder="Type your caption…" aria-label="Your caption">
        <button class="btn" id="send">Send</button>
      </div>
      <p class="example" id="example" hidden></p>
      <p class="hint" id="hint"></p>
    </div>

    <div class="answers" id="answers" style="margin-top:14px"></div>
  </div>
</main>

<section class="board">
  <h2>Winners</h2>
  <ol id="boardList"></ol>
</section>

<div class="winner" id="winner" role="status" aria-live="assertive">
  <div>
    <div class="who" id="winWho">—</div>
    <div class="line" id="winLine">—</div>
    <div class="said" id="winSaid">—</div>
  </div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>

<script type="module">
import { FIREBASE, USER_KEY, GAMES } from "../../shared/config.js";
import { initCaption, watchRound, watchWinners, watchRevealed, submitCaption, serverNow, isClockReady, onClockChange, junkReason, junkMessage } from "../../shared/caption.js";

const CFG = GAMES.caption;
const TOTAL_ROUNDS = Math.max(0, Math.min(9, CFG.images.length - 1));
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- who's playing ---------- */
function getUser(){
  try{
    const raw = localStorage.getItem(USER_KEY); if(!raw) return null;
    const o = raw.trim().startsWith("{") ? JSON.parse(raw) : { login: raw };
    const login = String(o.login || o.display_name || o.name || "").toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,25);
    return login.length >= 2 ? { name: login, display: o.display_name || o.displayName || login } : null;
  }catch{ return null; }
}
const USER = getUser();

let round = { phase:"idle" }, sentFor = null, clockLoop = null, celebrated = null;

/* ---------- render ---------- */
function render(){
  const p = round.phase, live = p !== "idle" && round.image;
  $("idle").hidden = !!live; $("live").hidden = !live;

  $("chip").textContent = p === "idle" ? "Waiting…" : round.round ? `Round ${round.round}` : "Example";
  $("chip").classList.toggle("live", p === "submitting");
  if (!live){ showWinner(false); return; }

  const src = `images/${round.image}`;
  if ($("shot").getAttribute("src") !== src) $("shot").src = src;

  // typing box: visible for example / ready / submitting, only usable while submitting
  const typing = p === "example" || p === "ready" || p === "submitting";
  const already = sentFor && sentFor === round.roundId;
  $("entryArea").style.display = typing ? "grid" : "none";
  $("text").disabled = p !== "submitting" || already || !isClockReady();
  $("send").disabled = p !== "submitting" || already || !isClockReady();
  $("text").placeholder = p === "submitting" ? (already ? "Caption sent — good luck!" : "Type your caption…")
                        : p === "example" ? "This one's just an example" : "Wait for START…";
  $("text").classList.toggle("example-mode", p === "example");
  $("example").hidden = p !== "example";
  if (p === "example") $("example").innerHTML = `<b>Example:</b> “${esc(CFG.exampleCaption)}”`;

  // the 8
  if (p === "judging" && round.finalists){
    $("answers").innerHTML = round.finalists.map((f,i) =>
      `<div class="answer" style="animation-delay:${i*70}ms">${esc(f.text)}</div>`).join("");
  } else if (p !== "winner") $("answers").innerHTML = "";

  showWinner(p === "winner");
  runClock();
}

/* ---------- countdown (server-synced) ---------- */
function runClock(){
  cancelAnimationFrame(clockLoop);
  const on = round.phase === "submitting" && round.endsAt;
  $("clock").hidden = !on; $("bar").hidden = !on;
  if (!on) return;
  if (!isClockReady()) { $("clock").textContent = "…"; return; }
  const total = CFG.submitSeconds * 1000;
  const tick = () => {
    const left = Math.max(0, round.endsAt - serverNow());
    const low = left < 6000;
    $("clock").textContent = Math.ceil(left/1000);
    $("clock").classList.toggle("low", low);
    $("barFill").style.width = (left/total*100) + "%";
    $("barFill").classList.toggle("low", low);
    if (left <= 0){ $("text").disabled = true; $("send").disabled = true; $("text").placeholder = "Time's up! Picking answers…"; return; }
    clockLoop = requestAnimationFrame(tick);
  };
  tick();
}

/* ---------- sending ---------- */
$("send").addEventListener("click", send);
$("text").addEventListener("keydown", e => { if (e.key === "Enter"){ e.preventDefault(); send(); } });
$("text").addEventListener("input", () => { $("hint").textContent = ""; $("hint").className = "hint"; });

async function send(){
  const hint = $("hint"); hint.className = "hint";
  if (!USER){ hint.className = "hint bad"; hint.textContent = "Log in with Twitch on the homepage to join in."; return; }
  const r = junkReason($("text").value, CFG);
  if (r){ hint.className = "hint bad"; hint.textContent = junkMessage(r); return; }
  $("send").disabled = true;
  try{
    await submitCaption({ round, name: USER.name, display: USER.display, text: $("text").value, cfg: CFG });
    sentFor = round.roundId;
    hint.className = "hint ok"; hint.textContent = "Sent! Good luck.";
    render();
  }catch(err){
    hint.className = "hint bad"; hint.textContent = err.message;
    if (round.phase === "submitting" && isClockReady() && serverNow() <= round.endsAt) $("send").disabled = false;
  }
}

/* ---------- winner + fireworks + confetti ---------- */
function showWinner(on){
  $("winner").classList.toggle("on", on);
  if (!on){ celebrated = null; return; }
  const w = round.winner || {};
  $("winWho").textContent = w.display || w.name || "";
  $("winLine").textContent = `is the winner of Round ${round.round}!`;
  $("winSaid").textContent = `“${w.text || ""}”`;
  const key = round.roundId + ":" + w.name;
  if (celebrated !== key){ celebrated = key; celebrate(); }
}

const fx = $("fx"), ctx = fx.getContext("2d");
let parts = [], fxLoop = null, fxUntil = 0;
const COLORS = ["#FFC629","#FF6FB5","#7FD3FF","#8FE3A8","#FF8A3D","#C9A8FF","#FFFFFF"];
function resize(){ fx.width = innerWidth * devicePixelRatio; fx.height = innerHeight * devicePixelRatio; }
addEventListener("resize", resize); resize();

function burst(x, y){                               // one firework
  const n = 24, c = COLORS[Math.floor(Math.random()*COLORS.length)];
  for (let i=0;i<n;i++){
    const a = (i/n)*Math.PI*2, s = 2.5 + Math.random()*4.5;
    parts.push({ x, y, vx:Math.cos(a)*s, vy:Math.sin(a)*s, life:45+Math.random()*20, age:0, c, r:2.1, kind:"spark" });
  }
}
function confetti(){                                // falling paper
  for (let i=0;i<3;i++) parts.push({
    x: Math.random()*fx.width, y: -20, vx:(Math.random()-.5)*2, vy: 1.6+Math.random()*2.2,
    life: 110, age: 0, c: COLORS[Math.floor(Math.random()*COLORS.length)],
    w: 7+Math.random()*7, h: 4+Math.random()*5, rot: Math.random()*6, vr:(Math.random()-.5)*.25, kind:"paper"
  });
}
function celebrate(){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  fxUntil = performance.now() + 3000;
  let nextBoom = 0;
  cancelAnimationFrame(fxLoop);
  const step = t => {
    ctx.clearRect(0,0,fx.width,fx.height);
    const dpr = devicePixelRatio;
    if (t < fxUntil - 700){
      if (t > nextBoom){ burst(fx.width*(.15+Math.random()*.7), fx.height*(.12+Math.random()*.4)); nextBoom = t + 700 + Math.random()*500; }
      confetti();
    }
    parts = parts.filter(p => p.age < p.life);
    for (const p of parts){
      p.age++; p.x += p.vx*dpr; p.y += p.vy*dpr;
      if (p.kind === "spark"){ p.vx *= .97; p.vy = p.vy*.97 + .06; }
      else { p.rot += p.vr; p.vx += (Math.random()-.5)*.1; }
      ctx.globalAlpha = Math.max(0, 1 - p.age/p.life);
      ctx.fillStyle = p.c;
      if (p.kind === "spark"){ ctx.beginPath(); ctx.arc(p.x,p.y,p.r*dpr,0,Math.PI*2); ctx.fill(); }
      else { ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillRect(-p.w/2*dpr,-p.h/2*dpr,p.w*dpr,p.h*dpr); ctx.restore(); }
    }
    ctx.globalAlpha = 1;
    if (parts.length || t < fxUntil) fxLoop = requestAnimationFrame(step);
  };
  fxLoop = requestAnimationFrame(step);
}

/* ---------- winners board ----------
   Crowning a winner writes their name straight away, but the list only
   shows it once the admin has actually moved on to the next image — a
   separate "revealed" counter (bumped in showImage) tracks how far the
   game has progressed, independent of idle/reset states. */
let winners = {}, revealedThrough = 0;
function renderWinners(){
  const rows = [];
  for (let r = 1; r <= TOTAL_ROUNDS; r++){
    const isRevealed = r <= revealedThrough;
    const name = winners[r];
    rows.push(`<li class="${isRevealed && name ? "done" : ""}"><span class="rlabel">Round ${r}</span><span class="rwin${isRevealed && name ? "" : " pending"}">${isRevealed && name ? esc(name) : "—"}</span></li>`);
  }
  $("boardList").innerHTML = rows.join("");
}

/* ---------- boot ---------- */
onClockChange(() => render());
let unwatchRound = null;
function connectRound(){
  unwatchRound?.();
  unwatchRound = watchRound(r => {
    if (r.roundId !== round.roundId){ $("text").value = ""; $("hint").textContent = ""; }
    round = r; render(); renderWinners();
  }, e => {
    $("idle").textContent = "Couldn't load the game. Retrying automatically…";
    console.error("[caption] round read failed:", e);
    setTimeout(connectRound, 3000);
  });
}
(async () => {
  let delay = 1000;
  for (;;) {
    try{
      await initCaption(FIREBASE);
      connectRound();
      watchWinners(w => { winners = w; renderWinners(); }, () => {});
      watchRevealed(n => { revealedThrough = n; renderWinners(); }, () => {});
      break;
    }catch(e){
      $("idle").textContent = "Couldn't connect. Retrying automatically…";
      console.error("[caption] connection failed:", e);
      await new Promise(resolve => setTimeout(resolve, delay));
      delay = Math.min(delay * 2, 30000);
    }
  }
})();
</script>
</body>
</html>
