<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Caption This</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/ui.css">
<style>
.stage{width:100%; max-width:820px; display:grid; gap:18px}
.shot{
  width:100%; aspect-ratio:4/3; background:#1B1526; border-radius:16px;
  object-fit:contain; display:block; box-shadow:0 10px 0 -4px rgba(0,0,0,.45);
}
.clockbar{height:10px; background:rgba(255,255,255,.1); border-radius:999px; overflow:hidden}
.clockfill{height:100%; width:100%; background:var(--taxi); transition:width .25s linear}
.clockfill.low{background:#FF6B5A}

.rowline{display:flex; align-items:center; justify-content:space-between; gap:12px}
.rowline h2{font-family:Bungee,cursive; font-weight:400; font-size:17px; margin:0; color:var(--taxi)}
.secs{font-family:Bungee,cursive; font-size:17px}

.entry{display:flex; gap:10px; flex-wrap:wrap}
textarea{
  flex:1 1 320px; min-height:66px; resize:none;
  background:#2E2540; color:var(--paper); border:3px solid transparent; border-radius:12px;
  padding:13px 15px; font:700 16px/1.4 Nunito,sans-serif;
}
textarea:focus{outline:none; border-color:var(--taxi)}
textarea:disabled{opacity:.45}
.btn{
  font-family:Bungee,cursive; font-size:16px; background:var(--taxi); color:var(--ink);
  border:3px solid var(--ink); border-radius:12px; padding:13px 26px; cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.5);
}
.btn:hover{transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,.5)}
.btn:active{transform:translateY(5px); box-shadow:0 0 0 rgba(0,0,0,.5)}
.btn[disabled]{opacity:.4; cursor:not-allowed; transform:none}
.hint{font-size:13px; opacity:.65; min-height:18px; margin:0}
.hint.bad{color:#FF8D7F; opacity:1}

.cards{display:grid; gap:9px}
.cap{
  background:#2E2540; border-radius:12px; padding:14px 16px;
  font-size:16px; font-weight:700; line-height:1.4;
  border:3px solid transparent;
}
.cap.win{border-color:var(--taxi); background:rgba(255,198,41,.14)}
.cap .who{display:block; font-size:12px; opacity:.6; margin-top:5px; font-weight:900; letter-spacing:.05em; text-transform:uppercase}

.idle{
  background:#2E2540; border-radius:16px; padding:40px 24px; text-align:center;
  font-size:17px; opacity:.8;
}
.board{width:100%; max-width:820px}
.board h2{font-family:Bungee,cursive; font-weight:400; font-size:18px; margin:0 0 12px; color:var(--taxi)}
.board ol{list-style:none; margin:0; padding:0; display:grid; gap:6px}
.board li{display:grid; grid-template-columns:30px 1fr auto; gap:12px; align-items:center;
          background:rgba(255,255,255,.06); border-radius:10px; padding:10px 14px; font-weight:700; font-size:15px}
.board li.me{background:rgba(255,198,41,.16); box-shadow:inset 0 0 0 2px var(--taxi)}
.rank{font-family:Bungee,cursive; font-size:13px; opacity:.6}
.wins{font-family:Bungee,cursive; font-size:14px}
.note{font-size:13px; opacity:.6; margin-top:11px}
</style>
</head>
<body>

<nav class="topbar"><a class="back" href="../index.html"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 L3 7 L9 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a></nav>

<header class="head">
  <h1>Caption This</h1>
  <p>One image, one caption each, best one wins the round.</p>
</header>

<main class="stage" id="stage">
  <div class="idle" id="idle">Waiting for the next image…</div>

  <div id="live" hidden>
    <img class="shot" id="shot" alt="Image to caption">
    <div class="clockbar" style="margin-top:14px"><div class="clockfill" id="clockfill"></div></div>
    <div class="rowline" style="margin-top:10px">
      <h2 id="phaseLabel">Write your caption</h2>
      <span class="secs" id="secs"></span>
    </div>

    <div class="entry" style="margin-top:12px" id="entry">
      <textarea id="text" maxlength="100" placeholder="Type your caption…"></textarea>
      <button class="btn" id="send">Send</button>
    </div>
    <p class="hint" id="hint"></p>

    <div class="cards" id="cards"></div>
  </div>
</main>

<section class="board">
  <h2>Most rounds won</h2>
  <ol id="boardList"><li><span class="rank">—</span><span>Loading…</span><span class="wins"></span></li></ol>
  <p class="note" id="boardNote"></p>
</section>

<script type="module">
import { FIREBASE, USER_KEY, GAMES } from "../../shared/config.js";
import { initCaption, watchRound, submitCaption } from "../../shared/caption.js";
import { initLeaderboard, watchBoard } from "../../shared/leaderboard.js";

const CFG = GAMES.caption;
const $ = id => document.getElementById(id);

function getName(){
  try{
    const raw = localStorage.getItem(USER_KEY);
    if(!raw) return null;
    const o = raw.trim().startsWith("{") ? JSON.parse(raw) : { login: raw };
    return o.display_name||o.displayName||o.login||o.name||o.username||null;
  }catch{ return null; }
}
const NAME = getName();
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let round = { phase:"idle" }, sentFor = null, clock = null;

/* ---------- render ---------- */
function render(){
  const live = round.phase !== "idle";
  $("idle").hidden = live;
  $("live").hidden = !live;
  if(!live) return;

  $("shot").src = `images/${round.image}`;

  const submitting = round.phase === "submitting";
  const already = sentFor === round.roundId;
  $("entry").style.display = submitting ? "flex" : "none";
  $("text").disabled = already;
  $("send").disabled = already;

  $("phaseLabel").textContent =
    submitting ? (already ? "Caption sent" : "Write your caption")
    : round.phase === "closed"  ? "Submissions closed"
    : round.phase === "judging" ? "Pick of the bunch"
    : "Winner";

  const cards = $("cards");
  if(round.phase === "judging" && round.finalists){
    cards.innerHTML = round.finalists
      .map(f => `<div class="cap">${esc(f.text)}</div>`).join("");
  } else if(round.phase === "winner" && round.winner){
    cards.innerHTML = `<div class="cap win">${esc(round.winner.text)}
      <span class="who">${esc(round.winner.name)}</span></div>`;
  } else {
    cards.innerHTML = "";
  }
}

/* ---------- countdown ---------- */
function startClock(){
  cancelAnimationFrame(clock);
  const tick = () => {
    if(round.phase !== "submitting" || !round.endsAt){ $("secs").textContent=""; return; }
    const left = Math.max(0, round.endsAt - Date.now());
    const pct  = Math.max(0, Math.min(100, (left / (CFG.submitSeconds*1000)) * 100));
    $("clockfill").style.width = pct + "%";
    $("clockfill").classList.toggle("low", left < 6000);
    $("secs").textContent = Math.ceil(left/1000) + "s";
    if(left <= 0){ $("send").disabled = true; $("text").disabled = true; return; }
    clock = requestAnimationFrame(tick);
  };
  tick();
}

/* ---------- sending ---------- */
$("send").addEventListener("click", send);
$("text").addEventListener("keydown", e => {
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

async function send(){
  const hint = $("hint");
  hint.className = "hint";
  if(!NAME){ hint.className="hint bad"; hint.textContent="Log in with Twitch to join in."; return; }
  if(round.phase !== "submitting" || Date.now() > round.endsAt){
    hint.className="hint bad"; hint.textContent="Too late — submissions are closed."; return;
  }
  $("send").disabled = true;
  try{
    await submitCaption({
      roundId: round.roundId, name: NAME, text: $("text").value,
      maxLength: CFG.maxLength, blocklist: CFG.blocklist, existing: []
    });
    sentFor = round.roundId;
    hint.textContent = "Sent. Good luck.";
    render();
  }catch(err){
    hint.className = "hint bad";
    hint.textContent = err.message;
    $("send").disabled = false;
  }
}

/* ---------- leaderboard ---------- */
function renderBoard(rows){
  $("boardList").innerHTML = rows.length
    ? rows.map((r,i)=>`<li class="${NAME&&r.name.toLowerCase()===String(NAME).toLowerCase()?"me":""}"><span class="rank">${i+1}</span><span>${esc(r.name)}</span><span class="wins">${r.score}</span></li>`).join("")
    : `<li><span class="rank">—</span><span>No winners yet.</span><span class="wins"></span></li>`;
  $("boardNote").textContent = "Rounds won, all time.";
}

/* ---------- boot ---------- */
(async () => {
  if(!FIREBASE.databaseURL){
    $("idle").textContent = "Not connected: databaseURL is empty in shared/config.js.";
    return;
  }
  try{
    await Promise.all([ initCaption(FIREBASE), initLeaderboard(FIREBASE) ]);
    watchRound(r => {
      const changed = r.roundId !== round.roundId;
      round = r;
      if(changed){ $("text").value=""; $("hint").textContent=""; }
      render();
      startClock();
    }, e => { $("idle").textContent = "Couldn't read the round: " + e.message; });

    watchBoard({ game:"caption", limit:20, onData:renderBoard,
                 onError:e => $("boardNote").textContent = "Leaderboard error: " + e.message });
  }catch(e){
    $("idle").textContent = "Couldn't connect: " + e.message;
    console.error(e);
  }
})();
</script>
</body>
</html>
