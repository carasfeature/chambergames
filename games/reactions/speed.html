<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reaction Time — Chamber Avenue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/ui.css">
<style>
:root{ --ink:#241C30; --paper:#FFF8EC; --taxi:#FFC629; --stop:#E03A2F; --signgreen:#1F6B3E; --bad:#FF6B5A; }
*{box-sizing:border-box}
body{ margin:0; padding:22px 14px 56px; background:var(--ink); color:var(--paper);
      font-family:Nunito,system-ui,sans-serif; display:flex; flex-direction:column; align-items:center; gap:26px; }

.wrap{ position:relative; width:100%; max-width:1275px; container-type:inline-size;
       border-radius:14px; overflow:hidden; box-shadow:0 16px 0 -6px rgba(0,0,0,.5);
       cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; }
.wrap:focus-visible{outline:4px solid var(--taxi); outline-offset:3px}
.plate{display:block; width:100%; height:auto}
.layer{position:absolute; inset:0; width:100%; height:100%}
svg.fx{pointer-events:none}

@keyframes rush{
  0%{transform:translate(654px,356px) scale(.10); opacity:0}
  14%{opacity:1}
  100%{transform:translate(654px,548px) scale(1); opacity:1}
}
.dash{animation:rush 1.15s cubic-bezier(.5,0,.85,.5) infinite; animation-play-state:paused}
.driving .dash{animation-play-state:running}
.dash:nth-child(2){animation-delay:-.288s}
.dash:nth-child(3){animation-delay:-.575s}
.dash:nth-child(4){animation-delay:-.863s}

.sign{ position:absolute; left:61.33%; top:29.81%; width:9.41%; height:8.55%;
       background:var(--signgreen); border:.3cqw solid #FFF; border-radius:.5cqw;
       display:flex; flex-direction:column; align-items:center; justify-content:center;
       font-weight:700; color:#fff; line-height:1.05; pointer-events:none;
       box-shadow:0 .15cqw .3cqw rgba(0,0,0,.35); }
.sign span{font-size:1.5cqw; letter-spacing:.02em}
.sign span+span{border-top:.16cqw solid rgba(255,255,255,.9); margin-top:.3cqw; padding-top:.3cqw}

.counter{ position:absolute; left:49.10%; top:88.93%; width:11.29%; height:5.16%;
          display:grid; place-items:center; pointer-events:none;
          font-weight:900; font-size:1.55cqw; letter-spacing:.05em; color:#1d1d1d; }
.startbtn{ position:absolute; left:47.06%; top:70.44%; width:15.29%; height:6.92%;
           display:grid; place-items:center; border:0; cursor:pointer; background:transparent;
           color:#DDE8DD; font-family:Bungee,cursive; font-size:3cqw; letter-spacing:.03em; }
.startbtn:hover{color:#fff}
.startbtn:focus-visible{outline:.25cqw solid var(--taxi)}
.startbtn[hidden]{display:none}

.stopwrap{ position:absolute; left:51.29%; top:41.51%; transform:translate(-50%,-50%);
           width:18.8%; aspect-ratio:1; pointer-events:none; visibility:hidden;
           filter:drop-shadow(0 .6cqw 1cqw rgba(0,0,0,.45)); }
.stopwrap.show{visibility:visible; animation:pop .07s ease-out}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.86)}to{transform:translate(-50%,-50%) scale(1)}}

.flash{position:absolute; inset:0; display:none; place-items:center; pointer-events:none; text-align:center}
.flash.on{display:grid}
.flash .big{font-family:Bungee,cursive; font-size:7.5cqw; color:#fff; text-shadow:0 .45cqw 0 rgba(0,0,0,.65); line-height:1}
.flash .sub{font-weight:900; font-size:1.8cqw; margin-top:.6cqw; color:#fff; text-shadow:0 .2cqw .4cqw rgba(0,0,0,.85)}
.flash.void .big{color:var(--bad)}

.veil{position:absolute; inset:0; display:none; place-items:center; padding:4cqw;
      background:rgba(20,15,28,.88); text-align:center}
.veil.on{display:grid}
.card{max-width:56ch}
.card h1{font-family:Bungee,cursive; font-weight:400; font-size:3.2cqw; margin:0 0 2cqw; color:var(--taxi)}
.steps{list-style:none; margin:0 0 2.4cqw; padding:0; text-align:left; display:grid; gap:1.1cqw}
.steps li{font-size:1.8cqw; line-height:1.45; display:grid; grid-template-columns:auto 1fr; gap:1cqw}
.steps b{font-family:Bungee,cursive; font-weight:400; color:var(--taxi)}
.btn{ font-family:Bungee,cursive; font-size:1.9cqw; background:var(--taxi); color:var(--ink);
      border:.26cqw solid var(--ink); border-radius:1cqw; padding:1cqw 3cqw; cursor:pointer;
      box-shadow:0 .5cqw 0 rgba(0,0,0,.55); transition:transform .08s, box-shadow .08s; }
.btn:hover{transform:translateY(.15cqw); box-shadow:0 .35cqw 0 rgba(0,0,0,.55)}
.btn:active{transform:translateY(.5cqw); box-shadow:0 0 0 rgba(0,0,0,.55)}
.avg{font-family:Bungee,cursive; font-size:6cqw; color:var(--taxi); line-height:1; margin:.4cqw 0}
.runs{display:flex; gap:.7cqw; justify-content:center; flex-wrap:wrap; list-style:none; margin:1.4cqw 0; padding:0}
.runs li{font-weight:900; font-size:1.45cqw; background:rgba(255,255,255,.12); border-radius:.6cqw; padding:.5cqw 1cqw}
.msg{font-size:1.45cqw; margin-top:1.4cqw; min-height:1.8cqw; opacity:.9}

.board{width:100%; max-width:1275px}
.board h2{font-family:Bungee,cursive; font-weight:400; font-size:19px; margin:0 0 13px; color:var(--taxi)}
.board ol{list-style:none; margin:0; padding:0; display:grid; gap:6px;
          grid-template-columns:1fr}
@media(min-width:760px){.board ol{grid-template-columns:1fr 1fr; grid-template-rows:repeat(10,auto); grid-auto-flow:column; gap:6px 18px}}
.board li{display:grid; grid-template-columns:32px 1fr auto; gap:12px; align-items:center;
          background:rgba(255,255,255,.06); border-radius:10px; padding:11px 14px; font-weight:700; font-size:15px}
.board li.me{background:rgba(255,198,41,.16); box-shadow:inset 0 0 0 2px var(--taxi)}
.rank{font-family:Bungee,cursive; font-size:13px; opacity:.6}
.board li:first-child .rank{opacity:1; color:var(--taxi)}
.ms{font-family:Bungee,cursive; font-size:15px}
.note{font-size:13px; opacity:.6; margin-top:12px; line-height:1.5}
@media(prefers-reduced-motion:reduce){.dash{animation:none!important}}
</style>
</head>
<body>

<nav class="crumbs">
  <a href="../../index.html">Home</a><span>/</span>
  <a href="../index.html">Games</a><span>/</span>
  <a href="index.html">Reactions Test</a><span>/</span>
  <span>Reaction Speed</span>
</nav>

<div class="wrap" id="wrap" tabindex="0" role="button" aria-label="Reaction test. Click when the stop sign appears.">
  <img class="plate" src="road-plate.png" alt="View from the back seat of a car driving down a New York avenue">

  <svg class="layer fx" viewBox="0 0 1275 795" preserveAspectRatio="none" aria-hidden="true">
    <defs><clipPath id="roadclip"><rect x="560" y="350" width="200" height="186"/></clipPath></defs>
    <g clip-path="url(#roadclip)">
      <rect class="dash" x="-13" y="-25" width="26" height="50" rx="3" fill="#F2EFE4"/>
      <rect class="dash" x="-13" y="-25" width="26" height="50" rx="3" fill="#F2EFE4"/>
      <rect class="dash" x="-13" y="-25" width="26" height="50" rx="3" fill="#F2EFE4"/>
      <rect class="dash" x="-13" y="-25" width="26" height="50" rx="3" fill="#F2EFE4"/>
    </g>
  </svg>

  <div class="sign" aria-hidden="true"><span>CHAMBER</span><span>AVENUE</span></div>

  <div class="counter" id="counter">ROUNDS 0/5</div>
  <button class="startbtn" id="btnStart" hidden>START</button>

  <div class="stopwrap" id="stopwrap" aria-hidden="true">
    <svg viewBox="0 0 200 200">
      <polygon points="59,8 141,8 192,59 192,141 141,192 59,192 8,141 8,59" fill="#8E1F18" transform="translate(0,7)"/>
      <polygon points="59,8 141,8 192,59 192,141 141,192 59,192 8,141 8,59" fill="#E03A2F" stroke="#FFF8EC" stroke-width="10" stroke-linejoin="round"/>
      <polygon points="65,22 135,22 178,65 178,135 135,178 65,178 22,135 22,65" fill="none" stroke="#FFF8EC" stroke-width="5" opacity=".85"/>
      <text x="100" y="122" text-anchor="middle" font-family="Bungee,cursive" font-size="52" fill="#FFF8EC">STOP</text>
    </svg>
  </div>

  <div class="flash" id="flash"><div><div class="big" id="fBig">—</div><div class="sub" id="fSub"></div></div></div>

  <div class="veil on" id="veilIntro">
    <div class="card">
      <h1>Before you drive</h1>
      <ol class="steps">
        <li><b>1</b><span>Start the car.</span></li>
        <li><b>2</b><span>You have 5 tries to get the quickest reaction time.</span></li>
        <li><b>3</b><span>Your average time will show up on the leaderboard.</span></li>
      </ol>
      <button class="btn" id="btnOk">OK</button>
    </div>
  </div>

  <div class="veil" id="veilEnd">
    <div class="card">
      <h1 id="tierTitle">—</h1>
      <div class="avg" id="avgMs">—</div>
      <p id="tierBody" style="font-size:1.7cqw; margin:.4cqw 0 0">—</p>
      <ul class="runs" id="runs"></ul>
      <button class="btn" id="btnAgain">Drive again</button>
      <p class="msg" id="msg"></p>
    </div>
  </div>
</div>

<section class="board">
  <h2>Reaction Speed &mdash; Top 20</h2>
  <ol id="boardList"><li><span class="rank">—</span><span>Loading…</span><span class="ms"></span></li></ol>
  <p class="note" id="boardNote"></p>
</section>

<script type="module">
import { initLeaderboard, watchBoard, submitScore, RANGES } from "../../shared/leaderboard.js";

/* ===========================================================
   CONFIG
   =========================================================== */
const FIREBASE = { apiKey:"", authDomain:"", databaseURL:"", projectId:"",
                   storageBucket:"", messagingSenderId:"", appId:"" };

const USER_KEY = "twitchUser";   // whichever key your site's login writes to

const TRIES=5, DELAY_MIN=3000, DELAY_MAX=7000, FLOOR=10, FEEDBACK_MS=1400;

// TODO — real tier copy
const TIERS=[
  {max:250,      title:"Placeholder Tier 1", body:"Fast. Copy goes here."},
  {max:350,      title:"Placeholder Tier 2", body:"Average. Copy goes here."},
  {max:Infinity, title:"Placeholder Tier 3", body:"Slow. Copy goes here."}
];

/* ---------- who's playing (the site logged them in already) ---------- */
function getName(){
  try{
    const raw = localStorage.getItem(USER_KEY);
    if(!raw) return null;
    const o = raw.trim().startsWith("{") ? JSON.parse(raw) : { login: raw };
    return o.display_name || o.displayName || o.login || o.name || o.username || null;
  }catch{ return null; }
}
const NAME = getName();

/* ---------- elements ---------- */
const $=id=>document.getElementById(id);
const wrap=$("wrap"), stopSign=$("stopwrap"), counter=$("counter"),
      flash=$("flash"), fBig=$("fBig"), fSub=$("fSub"),
      veilIntro=$("veilIntro"), veilEnd=$("veilEnd"), btnStart=$("btnStart"),
      boardList=$("boardList"), boardNote=$("boardNote"), msg=$("msg");

let state="intro", times=[], signAt=0, raf=null, held=false;

const setCounter=()=>counter.textContent=`ROUNDS ${times.length}/${TRIES}`;
const driving=on=>wrap.classList.toggle("driving",on);

/* ---------- flow ---------- */
$("btnOk").addEventListener("click",e=>{
  e.stopPropagation(); veilIntro.classList.remove("on");
  state="idle"; btnStart.hidden=false;
});
btnStart.addEventListener("click",e=>{ e.stopPropagation(); beginRun(); });
$("btnAgain").addEventListener("click",e=>{ e.stopPropagation(); beginRun(); });

function beginRun(){
  times=[]; msg.textContent=""; setCounter();
  btnStart.hidden=true; veilEnd.classList.remove("on");
  nextTry();
}

function nextTry(){
  state="arming"; driving(true);
  stopSign.classList.remove("show");
  flash.classList.remove("on","void");
  const wait=DELAY_MIN+Math.random()*(DELAY_MAX-DELAY_MIN);
  const t0=performance.now();
  const tick=now=>{
    if(state!=="arming") return;
    if(now-t0>=wait){ stopSign.classList.add("show"); signAt=now; state="ready"; }
    else raf=requestAnimationFrame(tick);
  };
  raf=requestAnimationFrame(tick);
}

function press(){
  if(state==="arming"){ cancelAnimationFrame(raf); return voidTry("Too soon","Wait for the sign — that one doesn't count."); }
  if(state!=="ready") return;
  const ms=Math.round(performance.now()-signAt);
  if(ms<FLOOR) return voidTry("Too soon",`Under ${FLOOR}ms isn't a reaction. Round voided.`);
  times.push(ms); setCounter();
  state="feedback"; driving(false); stopSign.classList.remove("show");
  show(ms+"ms", times.length<TRIES?`Round ${times.length} of ${TRIES}`:"Adding it up…", false);
  setTimeout(()=>times.length>=TRIES?endRun():nextTry(), FEEDBACK_MS);
}

function voidTry(big,sub){
  state="feedback"; driving(false); stopSign.classList.remove("show");
  show(big,sub,true); setTimeout(nextTry,FEEDBACK_MS);
}
function show(big,sub,bad){
  fBig.textContent=big; fSub.textContent=sub;
  flash.classList.toggle("void",!!bad); flash.classList.add("on");
}

async function endRun(){
  state="done"; driving(false); flash.classList.remove("on");
  const avg=Math.round(times.reduce((a,b)=>a+b,0)/times.length);
  const tier=TIERS.find(t=>avg<=t.max);
  $("tierTitle").textContent=tier.title;
  $("tierBody").textContent=tier.body;
  $("avgMs").textContent=avg+"ms";
  $("runs").innerHTML=times.map((t,i)=>`<li>${i+1} · ${t}ms</li>`).join("");
  veilEnd.classList.add("on");

  // auto-save: only the better run is kept, so a bad one can never cost you
  const { min, max } = RANGES.reaction;
  if(!NAME){ msg.textContent="No Twitch name found, so this run wasn't saved."; return; }
  if(avg<min || avg>max){ msg.textContent=`Average of ${avg}ms is outside the range the leaderboard accepts.`; return; }
  msg.textContent="Saving…";
  try{
    const { saved, kept } = await submitScore({ game:"reaction", name:NAME, score:avg, extra:times.slice() });
    msg.textContent = saved ? "New personal best — you're on the board."
                            : `Your best run of ${kept.score}ms still stands.`;
  }catch(err){ msg.textContent="Couldn't save: "+err.message; }
}

/* ---------- input: fresh presses only ---------- */
wrap.addEventListener("pointerdown",e=>{
  if(e.target.closest("button")) return;
  if(held) return;
  held=true;
  if(state==="arming"||state==="ready"){ e.preventDefault(); press(); }
});
addEventListener("pointerup",()=>held=false);
addEventListener("pointercancel",()=>held=false);
wrap.addEventListener("keydown",e=>{
  if((e.key!==" "&&e.key!=="Enter")||e.repeat) return;
  if(state==="arming"||state==="ready"){ e.preventDefault(); press(); }
});

/* ---------- leaderboard ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderBoard(rows){
  boardList.innerHTML = rows.length
    ? rows.map((r,i)=>`<li class="${NAME&&r.name.toLowerCase()===String(NAME).toLowerCase()?"me":""}"><span class="rank">${i+1}</span><span>${esc(r.name)}</span><span class="ms">${r.score}ms</span></li>`).join("")
    : `<li><span class="rank">—</span><span>Nobody's driven yet. Be first.</span><span class="ms"></span></li>`;
  boardNote.textContent="Best average across a full five-round run. Beat yours and it updates automatically.";
}

(async () => {
  if(!FIREBASE.databaseURL){
    boardList.innerHTML="";
    boardNote.textContent="Leaderboard goes live once the Firebase config in this file is filled in.";
    return;
  }
  try{
    await initLeaderboard(FIREBASE);
    console.log("[leaderboard] connected —", FIREBASE.databaseURL, "— watching leaderboards/reaction");
    watchBoard({
      game:"reaction", limit:20,
      onData:rows => { console.log("[leaderboard] received", rows.length, "rows"); renderBoard(rows); },
      onError:e => {
        boardList.innerHTML="";
        boardNote.textContent=`Couldn't read the leaderboard (${e.code||"error"}): ${e.message}`;
      }
    });
  }catch(e){
    boardList.innerHTML="";
    boardNote.textContent="Couldn't connect to Firebase: "+e.message;
    console.error("[leaderboard] init failed:", e);
  }
})();

setCounter();
</script>
</body>
</html>
