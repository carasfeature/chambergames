<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sequence Memory — Central Park</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../shared/ui.css">
<style>
:root{ --ink:#241C30; --paper:#FFF8EC; --taxi:#FFC629; --bad:#FF6B5A; }

.wrap{
  position:relative; width:100%; max-width:1000px; aspect-ratio:5/3;
  container-type:inline-size;
  border-radius:14px; overflow:hidden;
  box-shadow:0 16px 0 -6px rgba(0,0,0,.5);
  user-select:none; -webkit-tap-highlight-color:transparent;
}
.scene{position:absolute; inset:0; width:100%; height:100%}

/* ---------- HUD ---------- */
.hud{
  position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between;
  padding:1.4cqw 2cqw; pointer-events:none;
  font-family:Bungee,cursive; font-size:2cqw; color:#2F4A2A;
  text-shadow:0 .1cqw 0 rgba(255,255,255,.55);
}
.hud .turn{transition:color .15s}
.hud .turn.go{color:#8A5A00}

/* ---------- 3x3 leaf grid ---------- */
.leaves{
  position:absolute; left:50%; top:54%; transform:translate(-50%,-50%);
  width:44cqw; aspect-ratio:1;
  display:grid; grid-template-columns:repeat(3,1fr); gap:1.6cqw;
}
.leaf{
  position:relative; padding:0; border:0; background:none; cursor:pointer;
  border-radius:50%;
}
.leaf:disabled{cursor:default}
.leaf svg{
  width:100%; height:100%; display:block;
  transform:rotate(var(--r,0deg));
  transition:transform .09s ease-out, filter .09s ease-out;
  filter:drop-shadow(0 .45cqw .5cqw rgba(0,0,0,.25));
}
.leaf .blade{fill:#5E8C4A; stroke:#3D5E30; transition:fill .08s}
.leaf .vein{stroke:#3D5E30}
.leaf:not(:disabled):hover .blade{fill:#6C9B57}
.leaf.lit svg{transform:rotate(var(--r,0deg)) scale(1.1);
              filter:drop-shadow(0 0 1.6cqw rgba(255,198,41,.95))}
.leaf.lit .blade{fill:var(--taxi); stroke:#9A6B00}
.leaf.lit .vein{stroke:#9A6B00}
.leaf.wrong .blade{fill:var(--bad); stroke:#8E1F18}
.leaf.wrong .vein{stroke:#8E1F18}
.leaf.hint svg{filter:drop-shadow(0 0 1.3cqw rgba(255,255,255,.95))}
.leaf.hint .blade{fill:#9FD08A}
.leaf:focus-visible{outline:.3cqw solid var(--taxi); outline-offset:.2cqw}

/* ---------- overlays ---------- */
.veil{position:absolute; inset:0; display:none; place-items:center; padding:4cqw;
      background:rgba(20,15,28,.88); text-align:center; color:var(--paper)}
.veil.on{display:grid}
.card{max-width:54ch}
.card h1{font-family:Bungee,cursive; font-weight:400; font-size:3.4cqw; margin:0 0 2.2cqw; color:var(--taxi)}
.steps{list-style:none; margin:0 0 2.6cqw; padding:0; text-align:left; display:grid; gap:1.2cqw}
.steps li{font-size:1.9cqw; line-height:1.45; display:grid; grid-template-columns:auto 1fr; gap:1.1cqw}
.steps b{font-family:Bungee,cursive; font-weight:400; color:var(--taxi)}
.btn{ font-family:Bungee,cursive; font-size:2cqw; background:var(--taxi); color:var(--ink);
      border:.26cqw solid var(--ink); border-radius:1cqw; padding:1.1cqw 3.2cqw; cursor:pointer;
      box-shadow:0 .5cqw 0 rgba(0,0,0,.55); transition:transform .08s, box-shadow .08s; }
.btn:hover{transform:translateY(.15cqw); box-shadow:0 .35cqw 0 rgba(0,0,0,.55)}
.btn:active{transform:translateY(.5cqw); box-shadow:0 0 0 rgba(0,0,0,.55)}
.final{font-family:Bungee,cursive; font-size:7cqw; color:var(--taxi); line-height:1; margin:.6cqw 0}
.sub{font-size:1.8cqw; opacity:.85; margin:0}
.msg{font-size:1.5cqw; margin-top:1.6cqw; min-height:1.9cqw; opacity:.9}

/* ---------- leaderboard ---------- */
.board{width:100%; max-width:1000px}
.board h2{font-family:Bungee,cursive; font-weight:400; font-size:19px; margin:0 0 13px; color:var(--taxi)}
.board ol{list-style:none; margin:0; padding:0; display:grid; gap:6px; grid-template-columns:1fr}
@media(min-width:760px){.board ol{grid-template-columns:1fr 1fr; grid-template-rows:repeat(10,auto); grid-auto-flow:column; gap:6px 18px}}
.board li{display:grid; grid-template-columns:32px 1fr auto; gap:12px; align-items:center;
          background:rgba(255,255,255,.06); border-radius:10px; padding:11px 14px; font-weight:700; font-size:15px}
.board li.me{background:rgba(255,198,41,.16); box-shadow:inset 0 0 0 2px var(--taxi)}
.rank{font-family:Bungee,cursive; font-size:13px; opacity:.6}
.board li:first-child .rank{opacity:1; color:var(--taxi)}
.ms{font-family:Bungee,cursive; font-size:15px}
.note{font-size:13px; opacity:.6; margin-top:12px; line-height:1.5}
@media(prefers-reduced-motion:reduce){.leaf svg{transition:none}}
</style>
</head>
<body>

<nav class="topbar"><a class="back" href="index.html" onclick="try{if(document.referrer&&new URL(document.referrer).origin===location.origin){history.back();return false;}}catch(e){}"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M9 2 L3 7 L9 12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</a></nav>

<div class="wrap" id="wrap">
  <!-- Central Park, kept soft and low-contrast so the leaves are the only thing that pops -->
  <svg class="scene" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#CFE6E4"/><stop offset="100%" stop-color="#E9F0DC"/>
      </linearGradient>
      <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#B7D19F"/><stop offset="100%" stop-color="#A3C28A"/>
      </linearGradient>
    </defs>

    <rect width="1000" height="600" fill="url(#sky)"/>

    <!-- Manhattan skyline peeking over the trees -->
    <g fill="#B4C5CC" opacity=".75">
      <rect x="40"  y="120" width="46" height="150"/><rect x="92"  y="150" width="34" height="120"/>
      <rect x="132" y="96"  width="40" height="174"/><rect x="178" y="138" width="52" height="132"/>
      <rect x="690" y="130" width="44" height="140"/><rect x="740" y="84"  width="36" height="186"/>
      <rect x="752" y="66"  width="12" height="20"/>
      <rect x="782" y="118" width="54" height="152"/><rect x="842" y="146" width="40" height="124"/>
      <rect x="888" y="104" width="46" height="166"/><rect x="940" y="140" width="50" height="130"/>
    </g>

    <!-- tree line -->
    <g fill="#8FB47A">
      <circle cx="30"  cy="262" r="58"/><circle cx="110" cy="248" r="66"/><circle cx="200" cy="262" r="60"/>
      <circle cx="290" cy="250" r="64"/><circle cx="380" cy="266" r="56"/><circle cx="460" cy="252" r="62"/>
      <circle cx="545" cy="264" r="58"/><circle cx="630" cy="250" r="66"/><circle cx="720" cy="262" r="60"/>
      <circle cx="810" cy="248" r="64"/><circle cx="900" cy="262" r="58"/><circle cx="985" cy="252" r="62"/>
    </g>
    <g fill="#7FA66A" opacity=".85">
      <circle cx="70"  cy="292" r="46"/><circle cx="250" cy="296" r="50"/><circle cx="420" cy="292" r="44"/>
      <circle cx="590" cy="296" r="48"/><circle cx="760" cy="292" r="46"/><circle cx="940" cy="296" r="50"/>
    </g>

    <!-- lawn + winding path -->
    <rect y="300" width="1000" height="300" fill="url(#lawn)"/>
    <path d="M-20 600 C 180 520, 260 430, 470 400 S 820 340, 1020 330 L 1020 360 C 820 372, 640 420, 500 440 S 230 540, 90 600 Z"
          fill="#E3D9BE" opacity=".8"/>

    <!-- lamp post + bench, faint -->
    <g opacity=".35" fill="#51604A">
      <rect x="112" y="330" width="6" height="140"/><rect x="100" y="322" width="30" height="12" rx="4"/>
      <rect x="840" y="408" width="96" height="10" rx="3"/><rect x="840" y="388" width="96" height="8" rx="3"/>
      <rect x="846" y="418" width="6" height="26"/><rect x="924" y="418" width="6" height="26"/>
    </g>
  </svg>

  <div class="hud">
    <span id="hudLevel">Level 0/30</span>
    <span class="turn" id="hudTurn"></span>
  </div>

  <div class="leaves" id="leaves"></div>

  <!-- instructions -->
  <div class="veil on" id="veilIntro">
    <div class="card">
      <h1 id="introTitle">Before your walk</h1>
      <ol class="steps" id="introSteps"></ol>
      <button class="btn" id="btnStart">Start</button>
    </div>
  </div>

  <!-- result -->
  <div class="veil" id="veilEnd">
    <div class="card">
      <h1 id="endTitle">Walk's over</h1>
      <div class="final" id="finalLevel">—</div>
      <p class="sub" id="finalSub">—</p>
      <p><button class="btn" id="btnAgain">Go again</button></p>
      <p class="msg" id="msg"></p>
    </div>
  </div>
</div>

<section class="board">
  <h2>Sequence Memory &mdash; Top 20</h2>
  <ol id="boardList"><li><span class="rank">—</span><span>Loading…</span><span class="ms"></span></li></ol>
  <p class="note" id="boardNote"></p>
</section>

<script type="module">
import { initLeaderboard, watchBoard, submitScore, RANGES } from "../../shared/leaderboard.js";
import { FIREBASE, USER_KEY, GAMES } from "../../shared/config.js";
const CFG = GAMES.sequence;

const MAX   = CFG.maxLevel;
const FLASH = CFG.flashMs;
const GAP   = CFG.gapMs;
const TILT  = [-18, 12, -6, 22, -14, 8, -24, 16, -10];   // fixed per leaf, purely cosmetic

const $ = id => document.getElementById(id);
const grid=$("leaves"), hudLevel=$("hudLevel"), hudTurn=$("hudTurn"),
      veilIntro=$("veilIntro"), veilEnd=$("veilEnd"),
      boardList=$("boardList"), boardNote=$("boardNote"), msg=$("msg");

/* ---------- who's playing ---------- */
function getName(){
  try{
    const raw=localStorage.getItem(USER_KEY);
    if(!raw) return null;
    const o=raw.trim().startsWith("{")?JSON.parse(raw):{login:raw};
    return o.display_name||o.displayName||o.login||o.name||o.username||null;
  }catch{ return null; }
}
const NAME=getName();

/* ---------- build the 9 leaves ---------- */
const LEAF_SVG = `<svg viewBox="0 0 100 100" aria-hidden="true">
  <path class="blade" stroke-width="3" stroke-linejoin="round"
        d="M50 5 C79 21 91 52 71 80 C63 90 56 94 50 96 C44 94 37 90 29 80 C9 52 21 21 50 5 Z"/>
  <g class="vein" fill="none" stroke-width="2.6" stroke-linecap="round">
    <path d="M50 14 L50 92"/>
    <path d="M50 38 L34 28"/><path d="M50 38 L66 28"/>
    <path d="M50 56 L31 46"/><path d="M50 56 L69 46"/>
    <path d="M50 73 L36 65"/><path d="M50 73 L64 65"/>
  </g></svg>`;
grid.innerHTML = TILT.map((t,i) =>
  `<button class="leaf" data-i="${i}" style="--r:${t}deg" aria-label="Leaf ${i+1}" disabled>${LEAF_SVG}</button>`
).join("");
const leaves = [...grid.querySelectorAll(".leaf")];

/* ---------- instructions from config ---------- */
$("introTitle").textContent = CFG.title;
$("introSteps").innerHTML = CFG.steps.map((s,i)=>`<li><b>${i+1}</b><span>${s}</span></li>`).join("");

/* ---------- state ---------- */
let seq = [], level = 0, pos = 0, state = "intro", run = 0;
const wait = ms => new Promise(r => setTimeout(r, ms));
const rand = () => Math.floor(Math.random() * 9);
const setInput = on => leaves.forEach(l => l.disabled = !on);
const clearMarks = () => leaves.forEach(l => l.classList.remove("lit","wrong","hint"));

function hud(turn){
  hudLevel.textContent = `Level ${level}/${MAX}`;
  hudTurn.textContent = turn || "";
  hudTurn.classList.toggle("go", turn === "Your turn");
}

/* ---------- flow ---------- */
$("btnStart").addEventListener("click", start);
$("btnAgain").addEventListener("click", start);

function start(){
  run++;                                    // cancels any playback still running
  veilIntro.classList.remove("on");
  veilEnd.classList.remove("on");
  msg.textContent = "";
  seq = []; level = 0;
  clearMarks();
  nextLevel();
}

function nextLevel(){
  level++;
  if (CFG.extend) seq.push(rand());
  else seq = Array.from({ length: level }, rand);
  playback();
}

async function playback(){
  const me = run;
  state = "showing"; pos = 0;
  setInput(false); clearMarks();
  hud("Watch…");
  await wait(650);
  for (const i of seq){
    if (me !== run) return;
    leaves[i].classList.add("lit");
    await wait(FLASH);
    leaves[i].classList.remove("lit");
    await wait(GAP);
  }
  if (me !== run) return;
  state = "input";
  setInput(true);
  hud("Your turn");
}

grid.addEventListener("pointerdown", async e => {
  const leaf = e.target.closest(".leaf");
  if (!leaf || state !== "input") return;
  e.preventDefault();
  const i = Number(leaf.dataset.i);
  const me = run;

  if (i !== seq[pos]){
    state = "over"; setInput(false);
    leaf.classList.add("wrong");
    leaves[seq[pos]].classList.add("hint");       // show which leaf it should have been
    await wait(1100);
    if (me === run) finish(false);
    return;
  }

  leaf.classList.add("lit");
  setTimeout(() => leaf.classList.remove("lit"), 180);
  pos++;

  if (pos === seq.length){
    state = "between"; setInput(false);
    if (level >= MAX){ await wait(400); if (me === run) finish(true); return; }
    hud("Nice");
    await wait(700);
    if (me === run) nextLevel();
  }
});

/* ---------- end + save ---------- */
async function finish(won){
  state = "done"; setInput(false);
  const score = won ? MAX : level - 1;             // levels fully completed
  hud();

  $("endTitle").textContent  = won ? "You finished the walk!" : "Walk's over";
  $("finalLevel").textContent = `Level ${score}`;
  $("finalSub").textContent  = won
    ? `All ${MAX} levels, perfect memory.`
    : score === 0 ? "Missed the very first leaf — go again."
                  : `You remembered ${score} leaf${score === 1 ? "" : "s"} in a row.`;
  veilEnd.classList.add("on");

  const { min, max } = RANGES.sequence;
  if (!NAME){ msg.textContent = "No Twitch name found, so this run wasn't saved."; return; }
  if (score < min){ msg.textContent = "Clear at least level 1 to get on the board."; return; }
  if (score > max){ msg.textContent = "That's outside the range the leaderboard accepts."; return; }
  msg.textContent = "Saving…";
  try{
    const { saved, kept } = await submitScore({ game:"sequence", name:NAME, score });
    msg.textContent = saved ? "New personal best — you're on the board."
                            : `Your best of level ${kept.score} still stands.`;
  }catch(err){
    msg.textContent = /permission/i.test(err.message||"")
      ? "Firebase rejected the score — check the sequence rule allows 1–100."
      : "Couldn't save: " + err.message;
    console.error("[sequence] save failed", { score }, err);
  }
}

/* ---------- leaderboard ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderBoard(rows){
  boardList.innerHTML = rows.length
    ? rows.map((r,i)=>`<li class="${NAME&&r.name.toLowerCase()===String(NAME).toLowerCase()?"me":""}"><span class="rank">${i+1}</span><span>${esc(r.name)}</span><span class="ms">Lvl ${r.score}</span></li>`).join("")
    : `<li><span class="rank">—</span><span>Nobody's played yet. Be first.</span><span class="ms"></span></li>`;
  boardNote.textContent = "Highest level reached. Only your best run is kept.";
}

hud();

(async () => {
  if(!FIREBASE.databaseURL){
    boardList.innerHTML="";
    boardNote.textContent="Leaderboard is off: databaseURL is empty in shared/config.js.";
    return;
  }
  try{
    await initLeaderboard(FIREBASE);
    watchBoard({
      game:"sequence", limit:20, onData:renderBoard,
      onError:e=>{ boardList.innerHTML=""; boardNote.textContent=`Couldn't read the leaderboard (${e.code||"error"}): ${e.message}`; }
    });
  }catch(e){
    boardList.innerHTML="";
    boardNote.textContent="Couldn't connect to Firebase: "+e.message;
    console.error("[leaderboard] init failed:", e);
  }
})();
</script>
</body>
</html>
